<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Just a Question</title>
  <style>
    /* Clean, modern reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f7f9fc;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: 20px;
    }

    /* Container setup */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    /* Screens & transitions */
    .screen {
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }

    .screen.active {
      display: block;
      opacity: 1;
    }

    /* Typography */
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Input styling for mobile Safari */
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px; /* Prevents auto-zoom on iOS */
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      margin-bottom: 16px;
      background-color: #f8fafc;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #94a3b8;
      background-color: #ffffff;
    }

    /* Button styling */
    .btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      background-color: #3b82f6;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: #2563eb;
    }

    /* Button layout for Screen 2 */
    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #334155;
    }

    .btn-secondary:active {
      background-color: #e2e8f0;
    }

    .result-text {
      font-size: 18px;
      font-weight: 500;
      color: #1e293b;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- SCREEN 1 -->
    <div id="screen1" class="screen active">
      <h1>Hello 👋</h1>
      <p>What's your name?</p>
      <input type="text" id="nameInput" placeholder="Enter your name..." autocomplete="off" />
      <button class="btn" onclick="goToScreen2()">Continue</button>
    </div>

    <!-- SCREEN 2 -->
    <div id="screen2" class="screen">
      <h1 id="greetingTitle">Hi 👋</h1>
      <p>I have one very important question...</p>
      <p style="color: #1e293b; font-weight: 500; margin-bottom: 20px;">
        Do I disturb you sometimes? 😂
      </p>
      
      <div id="choiceButtons" class="btn-group">
        <button class="btn" onclick="handleChoice('yes')">Yes</button>
        <button class="btn btn-secondary" onclick="handleChoice('no')">No</button>
      </div>

      <div id="resultArea" style="display: none;">
        <p id="resultText" class="result-text"></p>
      </div>
    </div>
  </div>

  <script>
    function goToScreen2() {
      const name = document.getElementById('nameInput').value.trim();
      const s1 = document.getElementById('screen1');
      const s2 = document.getElementById('screen2');
      
      if (name !== "") {
        document.getElementById('greetingTitle').innerText = `Hi, ${name} 👋`;
      }

      s1.classList.remove('active');
      setTimeout(() => {
        s1.style.display = 'none';
        s2.style.display = 'block';
        setTimeout(() => s2.classList.add('active'), 20);
      }, 250);
    }

    function handleChoice(answer) {
      const buttons = document.getElementById('choiceButtons');
      const resultArea = document.getElementById('resultArea');
      const resultText = document.getElementById('resultText');

      buttons.style.display = 'none';
      resultArea.style.display = 'block';

      if (answer === 'yes') {
        resultText.innerText = "Okay, I will try not to 😭";
      } else {
        resultText.innerText = "Happy to hear that 🌷";
      }
    }
  </script>

</body>
</html>
